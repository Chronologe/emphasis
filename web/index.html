<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Google fragt zuerst /favicon.ico an und verlangt quadratische Icons in
         Vielfachen von 48px; Browser bevorzugen die SVG-Fassung. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1015" />
    <!-- Titel, Description, Canonical und JSON-LD setzt scripts/prerender.ts
         je Seite und Sprache. Die Werte hier greifen nur, falls eine Route
         noch nicht vorgerendert wurde. -->
    <title>Mix der Woche &amp; gemeinsame Playlists für Tidal – Emphasis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
